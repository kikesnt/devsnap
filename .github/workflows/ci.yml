name: CI

# Two jobs: one that always runs and proves the site builds, and one that
# deploys, which stays disabled until the repository has the Cloudflare
# variables set. A repository with no deployment configured should not show a
# red cross on every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_DOMAIN: ${{ vars.PUBLIC_SITE_DOMAIN }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_BELOW_TOOL: ${{ vars.PUBLIC_ADSENSE_SLOT_BELOW_TOOL }}
          PUBLIC_ADSENSE_SLOT_IN_ARTICLE: ${{ vars.PUBLIC_ADSENSE_SLOT_IN_ARTICLE }}
          PUBLIC_ADSENSE_SLOT_FOOTER: ${{ vars.PUBLIC_ADSENSE_SLOT_FOOTER }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
          PUBLIC_PUBLISHER_NAME: ${{ vars.PUBLIC_PUBLISHER_NAME }}
          PUBLIC_AUTHOR_NAME: ${{ vars.PUBLIC_AUTHOR_NAME }}

      - name: Type check
        run: npx tsc --noEmit

      - name: Logic tests
        run: npm run test

      - name: Post-build verifier
        run: npm run verify

      - name: SEO audit
        run: npm run seo

      - name: String literals
        run: npm run lint:strings

      - name: Start the preview server
        run: |
          npx astro preview --port 4321 > /tmp/astro-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null 2>&1; then
              echo "the preview server is up"
              exit 0
            fi
            sleep 1
          done
          echo "the preview server did not start"
          cat /tmp/astro-preview.log
          exit 1

      - name: End-to-end smoke test
        run: npm run smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4321
          # A missing browser must not turn the gate into a no-op.
          SMOKE_REQUIRED: '1'

      - name: Keep the build for the deploy job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  ads:
    name: AdSense build and consent flow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install
        run: npm ci

      # A separate job on purpose: this rebuilds dist with a placeholder
      # publisher id, and the artifact the deploy job publishes is the one
      # the check job built with the real configuration.
      - name: AdSense build check
        run: npm run check:ads

      - name: Start the preview server
        run: |
          npx astro preview --port 4321 > /tmp/astro-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null 2>&1; then
              echo "the preview server is up"
              exit 0
            fi
            sleep 1
          done
          echo "the preview server did not start"
          cat /tmp/astro-preview.log
          exit 1

      - name: Consent flow check
        run: npm run check:consent
        env:
          CONSENT_BASE_URL: http://127.0.0.1:4321
          # A missing browser must not turn the gate into a no-op.
          CONSENT_REQUIRED: '1'

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    # Nothing happens until this variable is set to "true" in
    # Settings -> Secrets and variables -> Actions -> Variables.
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'devsnap' }} --branch=main
